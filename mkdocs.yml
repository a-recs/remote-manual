site_name: 遠隔教育運営マニュアル
site_description: 遠隔授業の運営・機器・アプリ操作をまとめたWebマニュアル
site_url: https://a-recs.github.io/remote-manual/

nav:
  - ホーム: index.md
  - 授業配信の流れ: lesson-flow/index.md
  - MetaMoJi ClassRoom:
      - metamoji/index.md
      - 操作編:
          - metamoji/operation/index.md
          - ログイン・学校選択: metamoji/01-login.md
          - マイボックスとクラスボックス: metamoji/02-box.md
          - 教材準備・配布: metamoji/03-material.md
          - レイヤー: metamoji/04-layer.md
          - 授業中の基本操作: metamoji/05-operation.md
      - 管理者編:
          - metamoji/admin/index.md
          - 生徒登録: metamoji/admin/01-student-registration.md
          - クラス作成: metamoji/admin/02-class-create.md
          - クラス所属: metamoji/admin/03-class-members.md
          - CSV一括登録: metamoji/admin/05-bulk-import.md
          - QRコード: metamoji/admin/04-qr.md
          - 年度更新: metamoji/admin/02-annual-renewal.md
  - Zoom: zoom/index.md
  - Neat Pulse: neat-pulse/index.md
  - ATEM Mini Pro:
      - atem-mini-pro/index.md
      - 本体操作: atem-mini-pro/operation/index.md
      - ATEM Software Control: atem-mini-pro/software-control/index.md

theme:
  name: material
  language: ja
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
  - stylesheets/sidebar-v2.css
