<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250">
  <rect width="840" height="250" fill="#ffffff"/>
  <style>
    text{font-family:Arial,"Noto Sans JP",sans-serif;fill:#20252f}
    .link{fill:#0b5cff}
  </style>
  <text x="28" y="34" font-size="19" font-weight="700">オプション</text>
  <text x="178" y="34" font-size="17" class="link">非表示</text>
  <rect x="178" y="56" width="18" height="18" rx="4" fill="#1e73e8"/>
  <path d="M182 65 l4 4 l7 -9" stroke="#fff" stroke-width="2.5" fill="none"/>
  <text x="208" y="71" font-size="17">任意の時刻に参加することを参加者に許可する</text>
  <rect x="178" y="88" width="18" height="18" rx="3" fill="#fff" stroke="#8793a2"/>
  <text x="208" y="103" font-size="17">入室時に参加者をミュートにする</text>
  <rect x="178" y="120" width="18" height="18" rx="3" fill="#fff" stroke="#8793a2"/>
  <text x="208" y="135" font-size="17" font-weight="700">ミーティングを自動的にレコーディングする</text>
  <rect x="178" y="152" width="18" height="18" rx="3" fill="#fff" stroke="#8793a2"/>
  <text x="208" y="167" font-size="17">特定の地域/国からのユーザーへのエントリを承認またはブロックする</text>
  <rect x="178" y="184" width="18" height="18" rx="3" fill="#fff" stroke="#8793a2"/>
  <text x="208" y="199" font-size="17">ミーティングコンテンツの画面キャプチャを阻止する</text>
  <rect x="195" y="113" width="470" height="34" rx="7" fill="none" stroke="#0b5cff" stroke-width="2"/>
</svg>