<svg xmlns="http://www.w3.org/2000/svg" width="183" height="331" viewBox="0 0 183 331">
  <rect width="183" height="331" fill="#ffffff"/>
  <g font-family="Arial,'Noto Sans JP',sans-serif" fill="#111111">
    <!-- My Box icon and title -->
    <g transform="translate(8 8)" stroke="#222" fill="none" stroke-width="1.6">
      <path d="M0 9 h12 l3 -5 h10 l3 5 h7 v18 H0 z"/>
      <circle cx="24" cy="6" r="4" fill="#fff"/>
      <path d="M19 15 q5 -5 10 0"/>
    </g>
    <text x="54" y="29" font-size="16" font-weight="700">マイボックス</text>

    <!-- New button -->
    <rect x="2" y="44" width="116" height="50" rx="25" fill="#2f73ea"/>
    <text x="18" y="76" font-size="34" font-weight="300" fill="#fff">＋</text>
    <text x="56" y="76" font-size="19" font-weight="700" fill="#fff">新規</text>

    <!-- Menu -->
    <rect x="2" y="96" width="180" height="232" rx="4" fill="#ffffff" stroke="#a7a7a7"/>

    <!-- note -->
    <g transform="translate(11 107)" stroke="#666" fill="none" stroke-width="1.5">
      <rect x="0" y="0" width="23" height="28"/>
      <path d="M5 14 h13 M11 7 v14"/>
    </g>
    <text x="47" y="127" font-size="17">ノート</text>
    <line x1="138" y1="104" x2="138" y2="138" stroke="#c8c8c8"/>
    <path d="M158 116 l7 7 -7 7" fill="none" stroke="#555" stroke-width="1.5"/>

    <!-- camera -->
    <g transform="translate(11 150)" stroke="#555" fill="none" stroke-width="1.5">
      <rect x="0" y="6" width="26" height="18" rx="2"/>
      <path d="M7 6 l3 -5 h7 l3 5"/>
      <circle cx="13" cy="15" r="5"/>
    </g>
    <text x="47" y="171" font-size="17">カメラから</text>

    <!-- file from -->
    <g transform="translate(11 193)" stroke="#555" fill="none" stroke-width="1.5">
      <rect x="0" y="0" width="24" height="28"/>
      <path d="M12 22 V8 M6 14 l6 -6 6 6" fill="#555" stroke="#555"/>
    </g>
    <text x="47" y="214" font-size="17">ファイルから</text>

    <line x1="8" y1="229" x2="174" y2="229" stroke="#c7c7c7"/>

    <!-- folder -->
    <g transform="translate(11 241)" stroke="#666" fill="none" stroke-width="1.5">
      <path d="M0 5 h10 l3 4 h13 v20 H0 z"/>
      <path d="M13 13 v12 M7 19 h12"/>
    </g>
    <text x="47" y="263" font-size="17">フォルダ</text>

    <line x1="8" y1="281" x2="174" y2="281" stroke="#c7c7c7"/>

    <!-- box -->
    <g transform="translate(10 292)" stroke="#555" fill="none" stroke-width="1.5">
      <path d="M2 6 h23 l4 18 H0 z"/>
      <path d="M0 15 h10 q2 5 5 0 h14"/>
    </g>
    <text x="47" y="314" font-size="17">ボックス</text>
    <line x1="138" y1="289" x2="138" y2="322" stroke="#c8c8c8"/>
    <path d="M158 298 l7 7 -7 7" fill="none" stroke="#555" stroke-width="1.5"/>
  </g>
</svg>