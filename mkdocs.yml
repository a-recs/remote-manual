site_name: 遠隔教育運営マニュアル
site_description: 遠隔授業の運営・機器・アプリ操作をまとめたWebマニュアル
site_url: https://a-recs.github.io/remote-manual/

nav:
  - ホーム: index.md
  - MetaMoJi ClassRoom:
      - 操作編:
          - 概要: metamoji/index.md
          - 1. ログイン・学校選択: metamoji/01-login.md
          - 2. マイボックスとクラスボックス: metamoji/02-box.md
          - 3. 教材を準備・配布する: metamoji/03-material.md
          - 4. レイヤーを理解する: metamoji/04-layer.md
          - 5. 授業中の基本操作: metamoji/05-operation.md
      - 管理者編:
          - 概要: metamoji/admin/index.md
          - 0. 管理画面・メニュー早見表: metamoji/admin/00-menu-guide.md
          - 1. 初回導入・初期設定: metamoji/admin/01-initial-setup.md
          - 2. 年度更新: metamoji/admin/02-annual-renewal.md
          - 3. 年度途中の変更: metamoji/admin/03-midyear-management.md
  - Neat Pulse:
      - 端末確認・遠隔操作: neat-pulse/index.md

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
  - stylesheets/navigation.css
